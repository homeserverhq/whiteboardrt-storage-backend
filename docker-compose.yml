services:
  whiteboardrt-storage-backend:
    build: .
    image: whiteboardrt-storage-backend:latest
    container_name: whiteboardrt-storage-backend
    ports:
      - "8080:8080"
    environment:
      STORAGE_URI: redis://redis:6379
      LOG_LEVEL: warn
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: whiteboardrt-storage-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  redis-data:
